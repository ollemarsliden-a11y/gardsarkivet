<!DOCTYPE html>
<html lang="sv">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#14293d">
  <title>Marsliden 1:10</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;700&display=swap" rel="stylesheet">
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icon-192.png">
  <link rel="icon" href="icon-192.png">
  <link rel="stylesheet" href="css/style.css?v=5">
</head>
<body>
  <!-- Inloggningsvy -->
  <section id="login-view" class="view">
    <div class="login-box">
      <h1 class="wordmark">Marsliden <span class="beteckning">1:10</span></h1>
      <p class="tagline">Gårdsarkivet · Kultsjödalen</p>
      <form id="login-form">
        <label for="email">Din e-postadress</label>
        <input type="email" id="email" placeholder="namn@exempel.se" required autocomplete="email">
        <button type="submit" class="btn btn-primary">Skicka inloggningslänk</button>
      </form>
      <p id="login-status" class="status" hidden></p>
      <div class="login-divider">eller</div>
      <button id="google-btn" class="btn btn-google">
        <svg class="ikon" width="18" height="18" viewBox="0 0 48 48" aria-hidden="true"><path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/><path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/><path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/><path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/></svg>
        Logga in med Google
      </button>
      <p class="hint">Du får ett mejl med en länk – klicka på den så är du inloggad. Inget lösenord behövs. Endast inbjudna kan logga in.</p>
    </div>
  </section>

  <!-- Huvudvy -->
  <section id="main-view" class="view" hidden>
    <header>
      <div>
        <h1 class="wordmark">Marsliden <span class="beteckning">1:10</span></h1>
        <p class="tagline">Gårdsarkivet</p>
      </div>
      <div class="header-actions">
        <span id="user-email" class="user-email"></span>
        <button id="logout-btn" class="btn btn-small">Logga ut</button>
      </div>
    </header>

    <div class="search-row">
      <svg class="ikon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      <input type="search" id="search-input" placeholder="Sök på namn, beskrivning eller innehåll…" autocomplete="off" aria-label="Sök bland dokumenten">
    </div>

    <div class="sort-row">
      <label for="sort-select">Sortera</label>
      <select id="sort-select">
        <option value="nytt">Senast uppladdat</option>
        <option value="ar-gammalt">Årtal, äldst först</option>
        <option value="ar-nytt">Årtal, senast först</option>
        <option value="namn">Namn A–Ö</option>
      </select>
    </div>

    <nav id="category-nav" class="category-nav" aria-label="Kategorier">
      <button class="cat-btn active" data-cat="alla">Alla</button>
      <button class="cat-btn" data-cat="kopekontrakt">Köpekontrakt</button>
      <button class="cat-btn" data-cat="servitut">Servitut</button>
      <button class="cat-btn" data-cat="gavobrev">Gåvobrev</button>
      <button class="cat-btn" data-cat="avtal">Avtal</button>
      <button class="cat-btn" data-cat="foton">Foton</button>
      <button class="cat-btn" data-cat="ovrigt">Övrigt</button>
    </nav>

    <div class="big-actions">
      <button id="scan-btn" class="btn btn-primary btn-big">
        <svg class="ikon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M4 8V6a2 2 0 0 1 2-2h2M4 16v2a2 2 0 0 0 2 2h2M16 4h2a2 2 0 0 1 2 2v2M16 20h2a2 2 0 0 0 2-2v-2"/><circle cx="12" cy="12" r="3.2"/></svg>
        Skanna med kameran
      </button>
      <button id="upload-open-btn" class="btn btn-big">
        <svg class="ikon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
        Ladda upp fil
      </button>
    </div>
    <input type="file" id="scan-input" accept="image/*" capture="environment" hidden>

    <div id="doc-list" class="doc-list">
      <p class="empty-msg">Laddar…</p>
    </div>
  </section>

  <!-- Uppladdningsdialog -->
  <dialog id="upload-dialog">
    <form id="upload-form">
      <h2>Ladda upp</h2>
      <label for="file-input" id="file-label">Välj fil (PDF eller bild)</label>
      <input type="file" id="file-input" accept="application/pdf,image/*" required>
      <label for="title-input">Namn på dokumentet</label>
      <input type="text" id="title-input" placeholder="t.ex. Köpekontrakt 1962" required maxlength="120">
      <label for="year-input">Årtal (frivilligt)</label>
      <input type="number" id="year-input" placeholder="t.ex. 1962" min="1500" max="2100" inputmode="numeric">
      <label for="cat-input">Kategori</label>
      <select id="cat-input" required>
        <option value="kopekontrakt">Köpekontrakt</option>
        <option value="servitut">Servitut</option>
        <option value="gavobrev">Gåvobrev</option>
        <option value="avtal">Avtal</option>
        <option value="foton">Foton</option>
        <option value="ovrigt" selected>Övrigt</option>
      </select>
      <label for="desc-input">Beskrivning (frivilligt)</label>
      <textarea id="desc-input" rows="2" placeholder="t.ex. Servitut för vägen ner till sjön" maxlength="500"></textarea>
      <p id="upload-status" class="status" hidden></p>
      <div class="dialog-actions">
        <button type="button" id="upload-cancel-btn" class="btn">Avbryt</button>
        <button type="submit" id="upload-submit-btn" class="btn btn-primary">Ladda upp</button>
      </div>
    </form>
  </dialog>

  <!-- Skanningsdialog -->
  <dialog id="scan-dialog">
    <div class="scan-box">
      <h2>Skanna</h2>
      <div class="scan-mode" role="group" aria-label="Typ av skanning">
        <button type="button" id="mode-doc-btn" class="btn active">Dokument</button>
        <button type="button" id="mode-photo-btn" class="btn">Gammalt foto</button>
      </div>
      <p id="scan-status" class="status">Bearbetar bilden…</p>
      <label id="sharpen-row" class="sharpen-row" hidden>
        <input type="checkbox" id="sharpen-check">
        Förbättra skärpa och kontrast
      </label>
      <canvas id="scan-preview" class="scan-preview" hidden></canvas>
      <p id="page-count" class="page-count" hidden></p>
      <div class="dialog-actions">
        <button type="button" id="scan-cancel-btn" class="btn">Avbryt</button>
        <button type="button" id="scan-retake-btn" class="btn" hidden>Ta om</button>
        <button type="button" id="scan-back-btn" class="btn" hidden>Justera hörnen</button>
        <button type="button" id="scan-continue-btn" class="btn btn-primary" hidden>Beskär</button>
        <button type="button" id="scan-addpage-btn" class="btn" hidden>Lägg till sida</button>
        <button type="button" id="scan-accept-btn" class="btn btn-primary" hidden>Klar – fortsätt</button>
      </div>
    </div>
  </dialog>

  <!-- Kommentarsdialog -->
  <dialog id="comment-dialog">
    <div class="scan-box">
      <h2 id="comment-title">Kommentarer</h2>
      <div id="comment-list" class="comment-list"></div>
      <form id="comment-form">
        <label for="comment-input">Skriv en kommentar</label>
        <textarea id="comment-input" rows="2" required maxlength="500"
          placeholder="t.ex. Farfar vid båthuset, sommaren 1954"></textarea>
        <div class="dialog-actions">
          <button type="button" id="comment-close-btn" class="btn">Stäng</button>
          <button type="submit" class="btn btn-primary">Spara kommentar</button>
        </div>
      </form>
    </div>
  </dialog>

  <script type="module" src="js/app.js?v=9"></script>
</body>
</html>
